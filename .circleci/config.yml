version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2023.08
    resource_class: medium
    environment:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JVM_OPTS: "-Xmx4g"
    steps:
      - checkout
      - run:
          name: Check Java version
          command: java -version
      - restore_cache:
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum  "TMessagesProj_App/build.gradle" }}
      - run:
          name: Configure Gradle
          command: |
            mkdir -p ~/.gradle
            echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC" > ~/.gradle/gradle.properties
            echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
            echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
      - run:
          name: Download Dependencies
          command: |
            chmod +x gradlew
            ./gradlew dependencies
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum  "TMessagesProj_App/build.gradle" }}
      - run:
          name: Build APK
          command: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon
      - store_artifacts:
          path: TMessagesProj_App/build/outputs/apk/afat/release
          destination: apk

workflows:
  version: 2
  workflow:
    jobs:
      - build
