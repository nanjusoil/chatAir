version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2023.08-java11 # 使用 Java 11
    resource_class: xlarge # 增加资源类
    environment:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JVM_OPTS: "-Xmx8g"
      TERM: dumb
      _JAVA_OPTIONS: "-Xmx8g"
      ANDROID_HOME: /home/circleci/android-sdk
      ANDROID_NDK_HOME: /home/circleci/android-sdk/ndk/21.4.7075529
    steps:
      - checkout
      - run:
          name: Setup Android SDK
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
      - restore_cache:
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum  "TMessagesProj_App/build.gradle" }}
      - run:
          name: Configure Gradle
          command: |
            mkdir -p ~/.gradle
            echo "org.gradle.jvmargs=-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
            echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
            echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
            echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
            echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
            echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
      - run:
          name: Accept Android SDK licenses
          command: yes | sdkmanager --licenses
      - run:
          name: Download NDK
          command: |
            sdkmanager --install "ndk;21.4.7075529"
            sdkmanager --install "cmake;3.22.1"
      - run:
          name: Build APK
          command: |
            chmod +x gradlew
            ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon --max-workers 2
          no_output_timeout: 30m
      - save_cache:
          paths:
            - ~/.gradle
            - ~/.android
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum  "TMessagesProj_App/build.gradle" }}
      - store_artifacts:
          path: TMessagesProj_App/build/outputs/apk/afat/release
          destination: apk

workflows:
  version: 2
  workflow:
    jobs:
      - build
