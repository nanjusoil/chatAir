version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2023.08-java11
    resource_class: large
    steps:
      - checkout
      - run:
          name: Build APK
          command: |
            chmod +x gradlew
            ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon

      - store_artifacts:
          path: TMessagesProj_App/build/outputs/apk/afat/release
          destination: apk

workflows:
  version: 2
  build-deploy:
    jobs:
      - build
