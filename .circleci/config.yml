version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
      _JAVA_OPTIONS: "-Xmx4g"
    
    steps:
      - checkout
      
      # 恢復 Gradle 包裝器緩存
      - restore_cache:
          key: v1-gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      
      # 恢復 Gradle 緩存
      - restore_cache:
          key: v1-gradle-cache-{{ checksum "build.gradle" }}-{{ checksum "TMessagesProj_App/build.gradle" }}
      
      # 恢復 Android 構建緩存
      - restore_cache:
          key: v1-android-build-{{ .Branch }}-{{ .Revision }}
      
      - run:
          name: Setup Gradle Properties
          command: |
            mkdir -p ~/.gradle
            echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
            echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
            
      - run:
          name: Build APK
          command: |
            chmod +x gradlew
            ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon --info

      # 保存 Gradle 包裝器緩存
      - save_cache:
          paths:
            - ~/.gradle/wrapper
          key: v1-gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      
      # 保存 Gradle 緩存
      - save_cache:
          paths:
            - ~/.gradle/caches
          key: v1-gradle-cache-{{ checksum "build.gradle" }}-{{ checksum "TMessagesProj_App/build.gradle" }}
      
      # 保存 Android 構建緩存
      - save_cache:
          paths:
            - ~/.android/build-cache
            - TMessagesProj_App/.gradle
            - TMessagesProj_App/build
            - TMessagesProj/.cxx
          key: v1-android-build-{{ .Branch }}-{{ .Revision }}

      - store_artifacts:
          path: TMessagesProj_App/build/outputs/apk/afat/release
          destination: apk

workflows:
  version: 2
  build-deploy:
    jobs:
      - build
