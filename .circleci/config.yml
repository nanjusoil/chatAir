version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2023.08
    resource_class: large
    environment:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JVM_OPTS: "-Xmx4g"
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - v1-gradle-wrapper-
      - restore_cache:
          keys:
            - v1-gradle-cache-{{ checksum "build.gradle" }}-{{ checksum "TMessagesProj_App/build.gradle" }}
            - v1-gradle-cache-
      - restore_cache:
          keys:
            - v1-build-cache-{{ .Branch }}-{{ .Revision }}
            - v1-build-cache-{{ .Branch }}-
            - v1-build-cache-
      - run:
          name: Configure Gradle
          command: |
            mkdir -p ~/.gradle
            echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC" > ~/.gradle/gradle.properties
            echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
            echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
            echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
            echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
            echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
            # 移除了 android.enableBuildCache
      - run:
          name: Build APK
          command: |
            chmod +x gradlew
            ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon --build-cache
      - save_cache:
          paths:
            - ~/.gradle/wrapper
          key: v1-gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      - save_cache:
          paths:
            - ~/.gradle/caches
          key: v1-gradle-cache-{{ checksum "build.gradle" }}-{{ checksum "TMessagesProj_App/build.gradle" }}
      - save_cache:
          paths:
            - ~/.android/build-cache
            - TMessagesProj_App/.gradle
            - TMessagesProj_App/build
            - TMessagesProj/.cxx
          key: v1-build-cache-{{ .Branch }}-{{ .Revision }}
      - store_artifacts:
          path: TMessagesProj_App/build/outputs/apk/afat/release
          destination: apk

workflows:
  version: 2
  workflow:
    jobs:
      - build
