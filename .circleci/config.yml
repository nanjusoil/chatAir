version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2023.08
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker
      - restore_cache:
          key: jars-{{ checksum "build.gradle" }}-{{ checksum  "TMessagesProj_App/build.gradle" }}
      - run:
          name: Download Dependencies
          command: ./gradlew androidDependencies
      - save_cache:
          paths:
            - ~/.gradle
          key: jars-{{ checksum "build.gradle" }}-{{ checksum  "TMessagesProj_App/build.gradle" }}
      - run:
          name: Grant execute permission for gradlew
          command: chmod +x gradlew
      - run:
          name: Build APK
          command: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon
      - store_artifacts:
          path: TMessagesProj_App/build/outputs/apk/afat/release
          destination: apk

workflows:
  version: 2
  build_and_test:
    jobs:
      - build:
          filters:
            branches:
              only:
                - chatair
